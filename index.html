<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Klassenbuch</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<style>
  :root{
    --fs1:16px;   /* Grundgröße */
    --fs2:20px;   /* zweite, größere/fette Größe für Überschriften & Labels */
    --pad:14px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background:#fff; color:#000;
    font-family:-apple-system,"Segoe UI",Arial,sans-serif;
    font-size:var(--fs1);
    line-height:1.45;
  }
  body{ padding: var(--pad); max-width:1100px; margin:0 auto; }
  header, #view-liste, #view-neu{ max-width:760px; margin-left:auto; margin-right:auto; }
  h1,h2{
    font-size:var(--fs2); font-weight:700; margin:0 0 12px 0; color:#777;
  }
  #titel{ font-size:var(--fs1); line-height:1.35; }
  a{ color:#0645AD; text-decoration:underline; }
  button, .btn{
    font-size:var(--fs1); font-family:inherit; color:#777; font-weight:700;
    background:linear-gradient(180deg, #ffffff, #ececec); border:2px solid #777; border-radius:10px;
    padding:10px 14px; cursor:pointer; min-height:44px;
    box-shadow:0 1px 0 rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.12),
      inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 3px rgba(0,0,0,.06);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover, .btn:hover{
    background:linear-gradient(180deg, #1a1a1a, #000); color:#fff;
    box-shadow:0 1px 0 rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.15), inset 0 -2px 3px rgba(0,0,0,.3);
  }
  button:active, .btn:active{
    transform:translateY(1px);
    box-shadow:0 1px 2px rgba(0,0,0,.15), inset 0 1px 3px rgba(0,0,0,.2);
  }
  button:disabled{ opacity:.4; cursor:default; box-shadow:none; transform:none; }
  button:disabled:hover{ background:linear-gradient(180deg, #ffffff, #ececec); color:#000; }
  input, textarea, select{
    font-family:inherit; font-size:var(--fs1); color:#000; background:#fff;
    border:1px solid #000; border-radius:8px; padding:8px; width:100%;
  }
  textarea{ resize:none; overflow:hidden; min-height:2.6em; }
  .feld-anzeige{
    font-family:inherit; font-size:var(--fs1); color:#000; background:#fff;
    border:1px solid #000; border-radius:8px; padding:8px; width:100%;
    min-height:2.6em; white-space:pre-wrap; word-break:break-word; cursor:text;
  }
  .feld-anzeige:empty:before{ content:attr(data-placeholder); opacity:.5; }
  .feld-anzeige a{ color:#0645AD; text-decoration:underline; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .feld-anzeige a:focus, .feld-anzeige a:active{ outline:none; }
  label{ font-size:var(--fs1); font-weight:700; display:block; margin:12px 0 4px; color:#777; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .row > *{ flex:1 1 160px; }
  hr{ border:none; border-top:1px solid #000; margin:18px 0; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .top-actions{ display:flex; gap:8px; }
  [hidden]{ display:none !important; }
  body:not(.admin-unlocked) .admin-only{ display:none !important; }
  body:not(.ansicht-liste) .admin-seite{ display:none !important; }

  /* Login */
  #login-overlay{
    position:fixed; inset:0; background:#fff; display:flex;
    align-items:center; justify-content:center; padding:var(--pad); z-index:1000;
  }
  #login-form{ width:100%; max-width:320px; }
  #login-form h1{ text-align:center; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:44px; }
  #login-form .pw-augen{
    position:absolute; top:50%; right:4px; transform:translateY(-50%);
    width:34px; height:34px; min-height:0; padding:0;
    border:none; background:none; font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:none;
  }
  #login-form .pw-augen:hover{ background:none; color:#000; box-shadow:none; }
  #login-form .pw-augen:active{ transform:translateY(-50%); box-shadow:none; }
  .login-fehler{ color:#777; font-weight:700; margin-top:8px; border:1px solid #000; padding:6px 8px; border-radius:8px; }
  #login-form button{ width:100%; }
  #login-form button + button{ margin-top:8px; }
  #btn-standort-kasumigaseki, #btn-standort-sagami-ono{ font-weight:700; }

  /* Kurs-Liste */
  #liste-items div.kurs-item{
    border:1px solid #000; border-radius:8px; padding:10px 12px; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  #liste-items div.kurs-item:hover{ background:var(--kurs-hell, #f2f2f2); }
  #liste-items .kurs-klick{ cursor:pointer; flex:1 1 auto; min-width:0; }
  .kurs-item .name{ font-size:var(--fs2); font-weight:700; color:#777; }
  .kurs-item .sub{ color:#000; font-size:var(--fs1); margin-top:2px; }
  .kurs-item .btn-kurs-loeschen-liste{ flex:0 0 auto; }
  .leer{ font-style:italic; }

  /* Kursdaten-Kopf */
  #kurs-meta-box{ border:2px solid #777; border-radius:8px; padding:12px; margin-bottom:16px; }
  #kurs-meta-box .name{ font-size:var(--fs2); font-weight:700; margin-bottom:6px; color:#777; }
  #kurs-meta-box .zeile{ margin:2px 0; }
  #kurs-meta-box .zeile b{ color:#777; }

  /* Einträge (zumpad-artige Blöcke) */
  .eintrag{ border:3px solid #777; border-radius:8px; padding:12px; margin-bottom:14px; position:relative; }
  .eintrag .kopf{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:8px; }
  .eintrag > .feldbox:first-of-type .feld-anzeige,
  .eintrag > .feldbox:first-of-type .feld-edit{ padding-right:50px; }
  .eintrag .kopf > div{ flex:1 1 150px; }
  .btn-del{
    position:absolute; top:10px; right:10px;
    width:30px; height:30px; min-height:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; border-width:2px; padding:0; line-height:1;
    color:#c92a2a; border-color:#c92a2a;
  }
  .btn-del:hover{ background:#c92a2a; color:#fff; }
  .save-hint{ font-size:calc(var(--fs1) - 2px); color:#000; opacity:.6; margin-top:2px; min-height:1em; }

  /* Mobil-Anpassung (Smartphone/Tablet) */
  @media (max-width:640px){
    body{ padding:10px; }
    #titel{ font-size:var(--fs1); }
    header{ flex-wrap:wrap; row-gap:8px; }
    .top-actions{ width:100%; flex-wrap:wrap; }
    .top-actions button{ flex:1 1 auto; }
    .row > *{ flex:1 1 100%; }
    .eintrag .kopf > div{ flex:1 1 100%; }
    .kurs-item{ flex-wrap:wrap; }
    .kurs-item .btn-kurs-loeschen-liste{ margin-left:auto; }
    .eintrag > .feldbox:first-of-type .feld-anzeige,
    .eintrag > .feldbox:first-of-type .feld-edit{ padding-right:46px; }
    .btn-del{ top:8px; right:8px; }
  }
  @media (hover:none){
    #liste-items div.kurs-item:hover{ background:#fff; }
    button:hover, .btn:hover{
      background:linear-gradient(180deg, #ffffff, #ececec); color:#777;
      box-shadow:0 1px 0 rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 3px rgba(0,0,0,.06);
    }
  }

  /* Kapitel-Anzeige (oben neben "+ Neuer Eintrag") */
  #kapitel-anzeige{
    flex:1 1 220px; align-self:center; font-size:var(--fs1); color:#000;
    font-weight:700; text-align:left; line-height:1.5;
  }
  #kapitel-anzeige b{ color:#000; }
  /* Fließtext statt Spalten: „Gemachte Übungen C-Teil:" bleibt zusammen, die Nummern folgen direkt dahinter;
     passt die Zeile nicht, rutscht die ganze Gruppe als Block in die nächste Zeile. */
  #kapitel-anzeige .kap-nr{ white-space:nowrap; margin-right:1.2em; }
  #kapitel-anzeige .cteil-gruppe{ display:inline-block; max-width:100%; }
  #kapitel-anzeige .kap-label{ white-space:nowrap; }

  /* Übungen C-Teil (Feld innerhalb jedes Eintrags) */
  .cteil-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .cteil-tag{ font-weight:700; color:#777; white-space:nowrap; }
  .cteil-select{ width:auto; flex:0 0 66px; min-height:38px; padding:4px 6px; }
  .cteil-nummern{ flex:1 1 160px; min-height:38px; }

  @media (max-width:640px){
    .cteil-select{ flex:0 0 58px; }
  }

  /* Eintragsboxen: Beschriftungen normal, eingetragene Inhalte fett */
  .eintrag label, .eintrag .cteil-tag{ font-weight:400; color:#000; }
  .eintrag input, .eintrag select, .eintrag textarea, .eintrag .feld-anzeige{ font-weight:700; }
  .eintrag input::placeholder, .eintrag textarea::placeholder{ font-weight:400; }
  .eintrag .feld-anzeige:empty:before{ font-weight:400; }

  /* Ab dem 2. Eintrag: nur noch feine Linie als Rahmen (Innenabstand gleicht die dünnere Linie aus) */
  .eintrag.alt{ border:1px solid #aaa; padding:14px; }
</style>
</head>
<body class="ansicht-liste">

<div id="login-overlay">
  <form id="login-form">
    <h1 style="margin-bottom:16px;">Zugang zu den Kursen</h1>
    <label for="login-pw">Kennwort</label>
    <div class="pw-wrap">
      <input id="login-pw" type="password" autocomplete="current-password" autofocus>
      <button type="button" id="btn-pw-anzeigen" class="pw-augen" title="Kennwort anzeigen" aria-label="Kennwort anzeigen">👁</button>
    </div>
    <div id="login-fehler" class="login-fehler" hidden>Falsches Kennwort.</div>
    <button type="button" id="btn-standort-kasumigaseki" style="margin-top:14px;">Kasumigaseki</button>
    <button type="button" id="btn-standort-sagami-ono" style="margin-top:8px;">Sagami-Ōno</button>
  </form>
</div>

<div id="app-content" hidden>

<header>
  <h1 id="titel">Kursliste</h1>
  <div class="top-actions">
    <button id="btn-neu-oeffnen" class="admin-seite admin-only">+ Neuer Kurs</button>
    <button id="btn-admin-toggle" class="btn admin-seite" title="Administrationszugang für die Kurs-Löschfunktion">Administration</button>
    <button id="btn-datensicherung" class="admin-seite admin-only" title="Alle Kursdaten dieses Standorts als Datei sichern">Datensicherung</button>
    <button id="btn-wiederherstellung" class="admin-seite admin-only" title="Datensicherungs-Datei einlesen">Wiederherstellung</button>
    <input type="file" id="datei-wiederherstellung" accept="application/json,.json" hidden>
  </div>
</header>

<div id="wiederherstellung-vorschau" class="admin-seite admin-only" hidden>
  <h2>Vorschau: Wiederherstellung</h2>
  <p id="wiederherstellung-info"></p>
  <div id="wiederherstellung-liste"></div>
  <div class="top-actions" style="margin-top:10px;">
    <button id="btn-wiederherstellung-abbrechen">Abbrechen</button>
  </div>
</div>

<!-- Ansicht 1: Kurs-Liste -->
<div id="view-liste">
  <div id="liste-items"><p class="leer">Lade Kurse…</p></div>
</div>

<!-- Ansicht 2: Neuer Kurs -->
<div id="view-neu" hidden>
  <h2>Neuen Kurs anlegen</h2>
  <label for="f-name">Kursname</label>
  <input id="f-name" type="text" placeholder="z. B. Deutsch B1 Abend">

  <label for="f-teilnehmer">Teilnehmende (eine Zeile pro Person)</label>
  <textarea id="f-teilnehmer" rows="4" placeholder="Max Mustermann&#10;Erika Musterfrau"></textarea>

  <div class="row">
    <div>
      <label for="f-raum">Raumnummer</label>
      <input id="f-raum" type="text" placeholder="z. B. 2.14">
    </div>
    <div>
      <label for="f-von">Zeitraum von</label>
      <input id="f-von" type="date">
    </div>
    <div>
      <label for="f-bis">Zeitraum bis</label>
      <input id="f-bis" type="date">
    </div>
  </div>

  <div class="top-actions" style="margin-top:14px;">
    <button id="btn-neu-speichern">Kurs anlegen</button>
    <button id="btn-neu-abbrechen">Abbrechen</button>
  </div>
</div>

<!-- Ansicht 3: Kurs-Detail (Zumpad-artig) -->
<div id="view-kurs" hidden>
  <div class="top-actions" style="justify-content:space-between;">
    <button id="btn-zurueck">← Zurück zur Liste</button>
    <div class="top-actions">
      <button id="btn-meta-bearbeiten" class="btn admin-only">Kursübersicht bearbeiten</button>
      <button id="btn-kursdaten-speichern" class="btn">PDF herunterladen</button>
    </div>
  </div>
  <hr>
  <div id="kurs-meta-box"></div>
  <div id="kurs-meta-edit" hidden style="margin-top:10px;">
    <label for="e-name">Kursname</label>
    <input id="e-name" type="text">
    <label for="e-teilnehmer">Teilnehmende (eine Zeile pro Person)</label>
    <textarea id="e-teilnehmer" rows="4"></textarea>
    <div class="row">
      <div><label for="e-raum">Raumnummer</label><input id="e-raum" type="text"></div>
      <div><label for="e-von">Zeitraum von</label><input id="e-von" type="date"></div>
      <div><label for="e-bis">Zeitraum bis</label><input id="e-bis" type="date"></div>
    </div>
    <div class="top-actions" style="margin-top:10px;">
      <button id="btn-meta-speichern">Speichern</button>
      <button id="btn-meta-abbrechen">Abbrechen</button>
      <button id="btn-kurs-loeschen" class="admin-only" style="margin-left:auto;">Kurs löschen</button>
    </div>
  </div>

  <hr>
  <div class="top-actions">
    <button id="btn-neuer-eintrag">+ Neuer Eintrag</button>
    <div id="kapitel-anzeige"></div>
  </div>
  <div id="eintraege" style="margin-top:14px;"></div>
</div>

</div><!-- /app-content -->
