<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Klassenbuch</title>
<style>
  :root{
    --fs1:16px;   /* Grundgröße */
    --fs2:20px;   /* zweite, größere/fette Größe für Überschriften & Labels */
    --pad:14px;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    background:#fff; color:#000;
    font-family:-apple-system,"Segoe UI",Arial,sans-serif;
    font-size:var(--fs1);
    line-height:1.45;
  }
  body{ padding: var(--pad); max-width:760px; margin:0 auto; }
  h1,h2{
    font-size:var(--fs2); font-weight:700; margin:0 0 12px 0; color:#777;
  }
  #titel{ font-size:var(--fs1); line-height:1.35; }
  a{ color:#0645AD; text-decoration:underline; }
  button, .btn{
    font-size:var(--fs1); font-family:inherit; color:#777; font-weight:700;
    background:linear-gradient(180deg, #ffffff, #ececec); border:2px solid #777; border-radius:10px;
    padding:10px 14px; cursor:pointer; min-height:44px;
    box-shadow:0 1px 0 rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.12),
      inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 3px rgba(0,0,0,.06);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  button:hover, .btn:hover{
    background:linear-gradient(180deg, #1a1a1a, #000); color:#fff;
    box-shadow:0 1px 0 rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.25),
      inset 0 1px 0 rgba(255,255,255,.15), inset 0 -2px 3px rgba(0,0,0,.3);
  }
  button:active, .btn:active{
    transform:translateY(1px);
    box-shadow:0 1px 2px rgba(0,0,0,.15), inset 0 1px 3px rgba(0,0,0,.2);
  }
  button:disabled{ opacity:.4; cursor:default; box-shadow:none; transform:none; }
  button:disabled:hover{ background:linear-gradient(180deg, #ffffff, #ececec); color:#000; }
  input, textarea{
    font-family:inherit; font-size:var(--fs1); color:#000; background:#fff;
    border:1px solid #000; border-radius:8px; padding:8px; width:100%;
  }
  textarea{ resize:none; overflow:hidden; min-height:2.6em; }
  .feld-anzeige{
    font-family:inherit; font-size:var(--fs1); color:#000; background:#fff;
    border:1px solid #000; border-radius:8px; padding:8px; width:100%;
    min-height:2.6em; white-space:pre-wrap; word-break:break-word; cursor:text;
  }
  .feld-anzeige:empty:before{ content:attr(data-placeholder); opacity:.5; }
  .feld-anzeige a{ color:#0645AD; text-decoration:underline; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .feld-anzeige a:focus, .feld-anzeige a:active{ outline:none; }
  label{ font-size:var(--fs1); font-weight:700; display:block; margin:12px 0 4px; color:#777; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .row > *{ flex:1 1 160px; }
  hr{ border:none; border-top:1px solid #000; margin:18px 0; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .top-actions{ display:flex; gap:8px; }
  [hidden]{ display:none !important; }
  body:not(.admin-unlocked) .admin-only{ display:none !important; }
  body:not(.ansicht-liste) .admin-seite{ display:none !important; }

  /* Login */
  #login-overlay{
    position:fixed; inset:0; background:#fff; display:flex;
    align-items:center; justify-content:center; padding:var(--pad); z-index:1000;
  }
  #login-form{ width:100%; max-width:320px; }
  #login-form h1{ text-align:center; }
  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:44px; }
  #login-form .pw-augen{
    position:absolute; top:50%; right:4px; transform:translateY(-50%);
    width:34px; height:34px; min-height:0; padding:0;
    border:none; background:none; font-size:18px; line-height:1;
    display:flex; align-items:center; justify-content:center;
    box-shadow:none;
  }
  #login-form .pw-augen:hover{ background:none; color:#000; box-shadow:none; }
  #login-form .pw-augen:active{ transform:translateY(-50%); box-shadow:none; }
  .login-fehler{ color:#777; font-weight:700; margin-top:8px; border:1px solid #000; padding:6px 8px; border-radius:8px; }
  #login-form button{ width:100%; }
  #login-form button + button{ margin-top:8px; }
  #btn-standort-kasumigaseki, #btn-standort-sagami-ono{ font-weight:700; }

  /* Kurs-Liste */
  #liste-items div.kurs-item{
    border:1px solid #000; border-radius:8px; padding:10px 12px; margin-bottom:8px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  #liste-items div.kurs-item:hover{ background:var(--kurs-hell, #f2f2f2); }
  #liste-items .kurs-klick{ cursor:pointer; flex:1 1 auto; min-width:0; }
  .kurs-item .name{ font-size:var(--fs2); font-weight:700; color:#777; }
  .kurs-item .sub{ color:#000; font-size:var(--fs1); margin-top:2px; }
  .kurs-item .btn-kurs-loeschen-liste{ flex:0 0 auto; }
  .leer{ font-style:italic; }

  /* Kursdaten-Kopf */
  #kurs-meta-box{ border:2px solid #777; border-radius:8px; padding:12px; margin-bottom:16px; }
  #kurs-meta-box .name{ font-size:var(--fs2); font-weight:700; margin-bottom:6px; color:#777; }
  #kurs-meta-box .zeile{ margin:2px 0; }
  #kurs-meta-box .zeile b{ color:#777; }

  /* Einträge (zumpad-artige Blöcke) */
  .eintrag{ border:3px solid #777; border-radius:8px; padding:12px; margin-bottom:14px; position:relative; }
  .eintrag .kopf{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:8px; }
  .eintrag > .feldbox:first-of-type .feld-anzeige,
  .eintrag > .feldbox:first-of-type .feld-edit{ padding-right:50px; }
  .eintrag .kopf > div{ flex:1 1 150px; }
  .btn-del{
    position:absolute; top:10px; right:10px;
    width:30px; height:30px; min-height:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:15px; border-width:2px; padding:0; line-height:1;
    color:#c92a2a; border-color:#c92a2a;
  }
  .btn-del:hover{ background:#c92a2a; color:#fff; }
  .save-hint{ font-size:calc(var(--fs1) - 2px); color:#000; opacity:.6; margin-top:2px; min-height:1em; }

  /* Mobil-Anpassung (Smartphone/Tablet) */
  @media (max-width:640px){
    body{ padding:10px; }
    #titel{ font-size:var(--fs1); }
    header{ flex-wrap:wrap; row-gap:8px; }
    .top-actions{ width:100%; flex-wrap:wrap; }
    .top-actions button{ flex:1 1 auto; }
    .row > *{ flex:1 1 100%; }
    .eintrag .kopf > div{ flex:1 1 100%; }
    .kurs-item{ flex-wrap:wrap; }
    .kurs-item .btn-kurs-loeschen-liste{ margin-left:auto; }
    .eintrag > .feldbox:first-of-type .feld-anzeige,
    .eintrag > .feldbox:first-of-type .feld-edit{ padding-right:46px; }
    .btn-del{ top:8px; right:8px; }
  }
  @media (hover:none){
    #liste-items div.kurs-item:hover{ background:#fff; }
    button:hover, .btn:hover{
      background:linear-gradient(180deg, #ffffff, #ececec); color:#777;
      box-shadow:0 1px 0 rgba(0,0,0,.15), 0 3px 6px rgba(0,0,0,.12),
        inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 3px rgba(0,0,0,.06);
    }
  }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* =====================================================================
   Klassenbuch – schlanke, Zumpad-artige Oberfläche auf Firebase RTDB.
   Datenmodell (bewusst kurze Schlüssel, um Speicher/Bandbreite zu sparen):
     kb/{standort}/m/{kursId}         = { n:Name, t:Teilnehmer, r:Raum, v:von, b:bis }
     kb/{standort}/e/{kursId}/{eid}   = { d:Datum, k:Kursleiter, i:Inhalt, h:Hausaufgaben }
   - standort ist 'kasumigaseki' oder 'sagami-ono': zwei komplett getrennte
     Kursübersichten im selben Firebase-Projekt.
   - Meta- und Eintragsdaten liegen in getrennten Zweigen: die Kursliste
     lädt NIE die (potenziell vielen) Unterrichtseinträge mit.
   - IDs kommen aus push() -> enthalten bereits eine Zeitkomponente,
     daher keine zusätzlichen Timestamp-Felder nötig.
   - Änderungen werden per update() nur für das jeweils geänderte Feld
     geschrieben (kein Überschreiben ganzer Objekte) und mit 600ms
     Verzögerung nach der letzten Eingabe gesendet.
   ===================================================================== */

const firebaseConfig = {
  apiKey:'AIzaSyAMi5PCfJ-Fwg20-urkTvpvVkWi7LI0JQo',
  databaseURL:'https://interaktive-tafel-default-rtdb.europe-west1.firebasedatabase.app',
  projectId:'interaktive-tafel',
  appId:'1:761401562204:web:02796fca95e0496c1cc299'
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let kurseCache = {};
let currentKursId = null;
let entriesCache = {};
let renderPending = false;
let standort = null; // 'kasumigaseki' | 'sagami-ono' – trennt die beiden Kursübersichten in Firebase komplett

const STANDORT_ANZEIGE = { kasumigaseki: 'Kasumigaseki', 'sagami-ono': 'Sagami\u2011Ōno' };
function kbM(){ return `kb/${standort}/m`; }
function kbE(kursId){ return `kb/${standort}/e/${kursId}`; }

const $ = id => document.getElementById(id);

function showView(name){
  $('view-liste').hidden  = name !== 'liste';
  $('view-neu').hidden    = name !== 'neu';
  $('view-kurs').hidden   = name !== 'kurs';
  document.body.classList.toggle('ansicht-liste', name === 'liste');
  $('titel').hidden = (name === 'kurs');
  $('btn-neu-oeffnen').hidden = (name === 'kurs');
}

function escHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDatum(iso){
  if(!iso) return '';
  const [y,m,t] = iso.split('-');
  return (t && m && y) ? `${t}.${m}.${y}` : iso;
}
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = (el.scrollHeight + 2) + 'px';
}
function linkify(escapedText){
  return escapedText.replace(/(\bhttps?:\/\/[^\s<]+|\bwww\.[^\s<]+\b)/gi, url => {
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    return `<a href="${href}" target="_blank" rel="noopener noreferrer">${url}</a>`;
  });
}
const KURS_FARBEN = ['#e64980','#1c7ed6','#2f9e44','#f08c00','#7048e8','#0ca678','#e8590c','#1098ad','#c2255c','#5c940d'];
function hashColor(str){
  let h = 0;
  for(let i = 0; i < str.length; i++){ h = (h * 31 + str.charCodeAt(i)) >>> 0; }
  return KURS_FARBEN[h % KURS_FARBEN.length];
}
function hexZuHell(hex, anteil = 0.85){
  const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16);
  const mix = c => Math.round(c + (255 - c) * anteil);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}
function segmentiereLinks(text){
  const regex = /(\bhttps?:\/\/\S+|\bwww\.\S+\b)/gi;
  const teile = [];
  let last = 0, m;
  while((m = regex.exec(text))){
    if(m.index > last) teile.push({ text: text.slice(last, m.index), link:false });
    const url = m[0];
    const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
    teile.push({ text: url, link:true, href });
    last = m.index + url.length;
  }
  if(last < text.length) teile.push({ text: text.slice(last), link:false });
  return teile.length ? teile : [{ text:'', link:false }];
}
function debounce(fn, ms){
  const timers = new Map();
  return (key, ...args) => {
    clearTimeout(timers.get(key));
    timers.set(key, setTimeout(() => fn(...args), ms));
  };
}

/* ---------- Kurs-Liste ---------- */

function starteKursListe(){
  db.ref(kbM()).on('value', snap => {
    kurseCache = snap.val() || {};
    renderKursListe();
  }, err => {
    $('liste-items').innerHTML = '<p class="leer">Fehler beim Laden: ' + escHtml(err.message) +
      '<br>Vermutlich erlauben die Firebase-Security-Rules den Lesezugriff auf "kb" (noch) nicht.</p>';
  });
}

function renderKursListe(){
  const box = $('liste-items');
  const ids = Object.keys(kurseCache).sort().reverse(); // push-Keys => neueste zuerst
  if(ids.length === 0){
    box.innerHTML = '<p class="leer">Noch keine Kurse angelegt. Mit „+ Neuer Kurs" beginnen.</p>';
    return;
  }
  box.innerHTML = ids.map(id => {
    const k = kurseCache[id];
    const namen = (k.t || '').split('\n').map(s=>s.trim()).filter(Boolean);
    const namenText = namen.length ? escHtml(namen.join(', ')) : 'keine Teilnehmende eingetragen';
    const zeitraum = [fmtDatum(k.v), fmtDatum(k.b)].filter(Boolean).join(' – ');
    const anzahl = k.c ?? 0;
    const anzahlText = `${anzahl} ${anzahl === 1 ? 'Eintrag' : 'Einträge'}`;
    const farbe = hashColor(id);
    return `<div class="kurs-item" data-id="${id}" style="border-color:${farbe}; border-width:3px; --kurs-hell:${hexZuHell(farbe)};">
      <div class="kurs-klick">
        <div class="name">${escHtml(k.n || '(ohne Namen)')}</div>
        <div class="sub">${namenText}${k.r ? ' · Raum ' + escHtml(k.r) : ''}${zeitraum ? ' · ' + escHtml(zeitraum) : ''} · ${anzahlText}</div>
      </div>
      <button class="btn-kurs-loeschen-liste admin-only" title="Kurs löschen">✕ Löschen</button>
    </div>`;
  }).join('');
  box.querySelectorAll('.kurs-klick').forEach(el => {
    el.addEventListener('click', () => openKurs(el.closest('.kurs-item').dataset.id));
  });
  box.querySelectorAll('.btn-kurs-loeschen-liste').forEach(el => {
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      const id = el.closest('.kurs-item').dataset.id;
      kursLoeschen(id);
    });
  });
}

function kursLoeschen(id){
  if(!adminUnlocked){ alert('Die Löschfunktion ist gesperrt. Bitte zuerst mit dem Kennwort für „Administration" entsperren.'); return; }
  const k = kurseCache[id] || {};
  if(!confirm(`Kurs „${k.n || ''}" inklusive aller Einträge unwiderruflich löschen?`)) return;
  if(currentKursId === id) db.ref(kbE(id)).off();
  Promise.all([db.ref(kbM() + '/' + id).remove(), db.ref(kbE(id)).remove()])
    .then(() => { if(currentKursId === id){ currentKursId = null; showView('liste'); } })
    .catch(err => alert('Konnte Kurs nicht löschen:\n' + err.message));
}

/* ---------- Neuer Kurs ---------- */

$('btn-neu-oeffnen').addEventListener('click', () => {
  $('f-name').value = ''; $('f-teilnehmer').value = '';
  $('f-raum').value = ''; $('f-von').value = ''; $('f-bis').value = '';
  showView('neu');
});
$('btn-neu-abbrechen').addEventListener('click', () => showView('liste'));

$('btn-neu-speichern').addEventListener('click', () => {
  const n = $('f-name').value.trim();
  if(!n){ alert('Bitte einen Kursnamen eingeben.'); return; }
  const meta = {
    n,
    t: $('f-teilnehmer').value.trim(),
    r: $('f-raum').value.trim(),
    v: $('f-von').value,
    b: $('f-bis').value,
    c: 0
  };
  const ref = db.ref(kbM()).push();
  ref.set(meta)
    .then(() => openKurs(ref.key))
    .catch(err => alert('Konnte Kurs nicht speichern:\n' + err.message +
      '\n\nMögliche Ursache: Die Firebase-Security-Rules erlauben Schreiben unter "kb" (noch) nicht.'));
});

/* ---------- Kurs-Detail ---------- */

function openKurs(id){
  currentKursId = id;
  entriesCache = {};
  renderMetaBox();
  $('kurs-meta-edit').hidden = true;
  showView('kurs');
  db.ref(kbE(id)).off();
  db.ref(kbE(id)).on('value', snap => {
    entriesCache = snap.val() || {};
    const anzahl = Object.keys(entriesCache).length;
    if((kurseCache[id]?.c ?? -1) !== anzahl){
      db.ref(kbM() + '/' + id).update({ c: anzahl }).catch(() => {});
    }
    if(elementeInContainerFokussiert()){ renderPending = true; return; }
    renderEintraege();
  }, err => {
    $('eintraege').innerHTML = '<p class="leer">Fehler beim Laden der Einträge: ' + escHtml(err.message) + '</p>';
  });
}

$('btn-zurueck').addEventListener('click', () => {

/* ---------- Einträge ---------- */

function elementeInContainerFokussiert(){
  const c = $('eintraege');
  return document.activeElement && c.contains(document.activeElement);
}
$('eintraege').addEventListener('focusout', () => {
  setTimeout(() => {
    if(renderPending && !elementeInContainerFokussiert()){
      renderPending = false;
      renderEintraege();
    }
  }, 0);
});

$('btn-neuer-eintrag').addEventListener('click', () => {

    .catch(err => alert('Konnte Eintrag nicht anlegen:\n' + err.message));
});

function renderEintraege(){
  const box = $('eintraege');
  const ids = Object.keys(entriesCache).sort().reverse(); // neueste zuerst
  if(ids.length === 0){
    box.innerHTML = '<p class="leer">Noch keine Einträge. Mit „+ Neuer Eintrag" beginnen.</p>';
    return;
  }
  box.innerHTML = ids.map((eid, idx) => {
    const e = entriesCache[eid] || {};
    return `<div class="eintrag" data-eid="${eid}">
      <button class="btn-del${idx === 0 ? '' : ' admin-only'}" title="Eintrag löschen">✕</button>
      <label>Weitermachen mit …</label>
      <div class="feldbox" data-field="h">
        <div class="feld-anzeige" data-placeholder="Weitermachen mit …">${e.h ? linkify(escHtml(e.h)) : ''}</div>
        <textarea class="feld-edit" hidden placeholder="Weitermachen mit …">${escHtml(e.h)}</textarea>
      </div>
      <label>Anmerkung!</label>
      <div class="feldbox" data-field="a">
        <div class="feld-anzeige" data-placeholder="z.B. Seite 34 ausgelassen, weil …">${e.a ? linkify(escHtml(e.a)) : ''}</div>
        <textarea class="feld-edit" hidden placeholder="z.B. Seite 34 ausgelassen, weil …">${escHtml(e.a)}</textarea>
      </div>
      <div class="kopf">
        <div><label>Datum</label><input type="date" data-field="d" value="${escHtml(e.d)}"></div>
        <div><label>Kursleitende/r</label><input type="text" data-field="k" value="${escHtml(e.k)}" placeholder="Name"></div>
      </div>
      <label>Inhalt / Hausaufgabe</label>
      <div class="feldbox" data-field="i">
        <div class="feld-anzeige" data-placeholder="Inhalt / Hausaufgabe…">${e.i ? linkify(escHtml(e.i)) : ''}</div>
        <textarea class="feld-edit" hidden placeholder="Inhalt / Hausaufgabe…">${escHtml(e.i)}</textarea>
      </div>
    </div>`;
  }).join('');

  box.querySelectorAll('.eintrag').forEach(card => {
    const eid = card.dataset.eid;
    card.querySelectorAll('input[data-field]').forEach(el => {
      el.addEventListener('input', () => saveField(`${eid}_${el.dataset.field}`, eid, el.dataset.field, el.value));
    });
    card.querySelectorAll('.feldbox').forEach(wrap => {
      const field = wrap.dataset.field;
      const anzeige = wrap.querySelector('.feld-anzeige');
      const edit = wrap.querySelector('.feld-edit');

      anzeige.addEventListener('click', ev => {
        if(ev.target.closest('a')) return; // Link ganz normal öffnen lassen, nicht in Bearbeiten wechseln
        edit.value = entriesCache[eid]?.[field] ?? edit.value;
        anzeige.hidden = true;
        edit.hidden = false;
        autoGrow(edit);
        edit.focus();
        edit.setSelectionRange(edit.value.length, edit.value.length);
      });
      edit.addEventListener('input', () => {
        autoGrow(edit);
        saveField(`${eid}_${field}`, eid, field, edit.value);
      });
      edit.addEventListener('blur', () => {
        const val = edit.value;
        anzeige.innerHTML = val.trim() === '' ? '' : linkify(escHtml(val));
        edit.hidden = true;
        anzeige.hidden = false;
      });
    });
    card.querySelector('.btn-del').addEventListener('click', () => {
      const knopf = card.querySelector('.btn-del');
      if(knopf.classList.contains('admin-only') && !adminUnlocked){
        alert('Nur der aktuellste Eintrag lässt sich ohne Administration löschen.');
        return;
      }
      if(confirm('Diesen Eintrag wirklich löschen?')){
        card.remove();
        delete entriesCache[eid];
        db.ref(`${kbE(currentKursId)}/${eid}`).remove()
          .catch(err => { alert('Konnte Eintrag nicht löschen:\n' + err.message); renderEintraege(); });
      }
    });
  });
}

const saveField = debounce((eid, field, value) => {
  db.ref(`${kbE(currentKursId)}/${eid}`).update({ [field]: value })
    .catch(err => console.error('Speichern fehlgeschlagen:', err.message));
}, 600);

const PW_HASH = 'ed61b00199cdeec7d82bb63a7f30f7743682d655dd1cb672dd9aedc5527c8bf8';
const PW_STORAGE_KEY = 'kb_auth_ok';
const PW_MERKEN_KEY = 'kb_pw_merken';
if(localStorage.getItem(PW_MERKEN_KEY)){
  $('login-pw').value = localStorage.getItem(PW_MERKEN_KEY);

async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function zeigeApp(){
  $('login-overlay').hidden = true;

}

async function versucheAnmeldung(gewaehlterStandort){
  const eingabe = $('login-pw').value;
  const hash = await sha256Hex(eingabe.toLowerCase());
  if(hash === PW_HASH){
    localStorage.setItem(PW_STORAGE_KEY, PW_HASH);
    localStorage.setItem(PW_MERKEN_KEY, eingabe);
    $('login-fehler').hidden = true;
    standort = gewaehlterStandort;
    zeigeApp();
  } else {
    $('login-fehler').hidden = false;
    $('login-pw').value = '';
    $('login-pw').focus();
  }
}

/* ---------- Daten speichern: Kurse als PDF ---------- */

async function pdfKurseExportieren(ids, btn){
  if(ids.length === 0){ alert('Bitte zuerst mindestens einen Kurs in der Liste markieren.'); return; }

  const altText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Erstelle PDF …';
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const seitenbreite = doc.internal.pageSize.getWidth();

    for(let i = 0; i < ids.length; i++){
      const id = ids[i];
      const k = kurseCache[id] || {};
      const snap = await db.ref(kbE(id)).once('value');
      const eintraegeObj = snap.val() || {};
      const eintraegeIds = Object.keys(eintraegeObj).sort(); // chronologisch aufsteigend fürs PDF

      if(i > 0) doc.addPage();

      doc.setFont(undefined, 'bold'); doc.setFontSize(16);
      doc.text(k.n || '(ohne Namen)', 40, 46);

      doc.setFont(undefined, 'normal'); doc.setFontSize(10);
      const namen = (k.t || '').split('\n').map(s=>s.trim()).filter(Boolean).join(', ') || '–';
      const zeitraum = [fmtDatum(k.v), fmtDatum(k.b)].filter(Boolean).join(' – ') || '–';
      const metaZeilen = doc.splitTextToSize(`Teilnehmende: ${namen}`, seitenbreite - 80);
      let y = 66;
      doc.text(metaZeilen, 40, y); y += metaZeilen.length * 12 + 4;
      doc.text(`Raum: ${k.r || '–'}`, 40, y); y += 14;
      doc.text(`Zeitraum: ${zeitraum}`, 40, y); y += 10;

      const zeilen = eintraegeIds.map(eid => {
        const e = eintraegeObj[eid];
        return [fmtDatum(e.d) || '–', e.k || '–', e.i || '–', e.h || '–', e.a || ''];
      });

      doc.autoTable({
        startY: y + 10,
        head: [['Datum', 'Kursleitende/r', 'Inhalt / Hausaufgabe', 'Weiter machen mit …', 'Anmerkung']],
        body: zeilen.length ? zeilen : [['–', '–', 'Keine Einträge vorhanden', '–', '']],
        theme: 'grid',
        styles:{ fontSize:9, cellPadding:5, textColor:[0,0,0], lineColor:[0,0,0], lineWidth:0.5, overflow:'linebreak', valign:'top' },
        headStyles:{ fillColor:[255,255,255], textColor:[0,0,0], fontStyle:'bold', lineWidth:0.5 },
        margin:{ left:40, right:40 },
        willDrawCell: data => {
          // Text dieser Zellen selbst zeichnen (siehe didDrawCell), damit Links klickbar werden.
          // Die Zeilenhöhe wurde vorher bereits anhand des Originaltexts korrekt berechnet.
          if(data.section === 'body' && data.column.index >= 2 && data.column.index <= 4){
            data.cell.text = [];
          }
        },
        didDrawCell: data => {
          if(data.section !== 'body' || data.column.index < 2 || data.column.index > 4) return;
          const roh = String(data.cell.raw ?? '');
          const padLinks = data.cell.padding('left');
          const padOben = data.cell.padding('top');
          const maxBreite = data.cell.width - padLinks - data.cell.padding('right');
          doc.setFontSize(9);
          let cy = data.cell.y + padOben + 7;
          roh.split('\n').forEach(zeile => {
            const gewrappt = doc.splitTextToSize(zeile === '' ? ' ' : zeile, maxBreite);
            gewrappt.forEach(sub => {
              let cx = data.cell.x + padLinks;
              segmentiereLinks(sub).forEach(teil => {
                if(!teil.text) return;
                if(teil.link){
                  doc.setTextColor(6, 69, 173);
                  doc.textWithLink(teil.text, cx, cy, { url: teil.href });
                } else {
                  doc.setTextColor(0, 0, 0);
                  doc.text(teil.text, cx, cy);
                }
                cx += doc.getTextWidth(teil.text);
              });
              cy += 11;
            });
          });
          doc.setTextColor(0, 0, 0);
        }
      });
    }

    const dateiname = ids.length === 1
      ? `${(kurseCache[ids[0]]?.n || 'Kurs').replace(/[^\w\-äöüÄÖÜß ]/g,'').trim() || 'Kurs'}_${new Date().toISOString().slice(0,10)}.pdf`
      : `Kursbuecher_${new Date().toISOString().slice(0,10)}.pdf`;
    doc.save(dateiname);
  } catch(err){
    alert('PDF konnte nicht erstellt werden:\n' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = altText;
  }
}

/* ---------- Datensicherung / Wiederherstellung (ersetzt den kompletten Standort-Datenbestand) ---------- */

let pendingWiederherstellung = null; // { m:{...}, e:{...} } aus eingelesener Datei, noch nicht gespeichert

async function datensicherungErstellen(){
  const btn = $('btn-datensicherung');
  const altText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Sichere …';
  try{
    const snap = await db.ref(`kb/${standort}`).once('value');
    const daten = snap.val() || { m:{}, e:{} };
    const inhalt = JSON.stringify({ standort, erstellt: new Date().toISOString(), m: daten.m || {}, e: daten.e || {} }, null, 2);
    const blob = new Blob([inhalt], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Datensicherung_${standort}_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  } catch(err){
    alert('Datensicherung fehlgeschlagen:\n' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = altText;
  }
}

async function wiederherstellungUebernehmen(){
  if(!confirm('Achtung: Damit werden ALLE aktuellen Kursdaten dieses Standorts endgültig gelöscht und durch die Daten aus der eingelesenen Datei ersetzt. Fortfahren?')) return;
  const btn = $('btn-datensicherung');
  const altText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Ersetze Daten …';
  try{
    await db.ref(`kb/${standort}`).remove();
    await db.ref(`kb/${standort}`).set({ m: pendingWiederherstellung.m || {}, e: pendingWiederherstellung.e || {} });
    pendingWiederherstellung = null;
    $('wiederherstellung-vorschau').hidden = true;
    $('datei-wiederherstellung').value = '';
    alert('Wiederherstellung abgeschlossen.');
  } catch(err){
    alert('Wiederherstellung fehlgeschlagen:\n' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = pendingWiederherstellung ? altText : 'Datensicherung';
  }
}

$('btn-datensicherung').addEventListener('click', () => {
  if(pendingWiederherstellung){
    wiederherstellungUebernehmen();
  } else {
    datensicherungErstellen();
  }
});

$('btn-wiederherstellung').addEventListener('click', () => {
  $('datei-wiederherstellung').click();
});

$('datei-wiederherstellung').addEventListener('change', ev => {
  const datei = ev.target.files[0];
  if(!datei) return;
  const reader = new FileReader();
  reader.onload = () => {
    let daten;
    try{ daten = JSON.parse(reader.result); }
    catch(err){ alert('Diese Datei ist keine gültige Datensicherung (kein lesbares JSON).'); return; }
    if(typeof daten !== 'object' || daten === null || (!daten.m && !daten.e)){
      alert('Diese Datei sieht nicht wie eine Klassenbuch-Datensicherung aus.');
      return;
    }
    pendingWiederherstellung = { m: daten.m || {}, e: daten.e || {} };
    const kursIds = Object.keys(pendingWiederherstellung.m);
    const gesamtEintraege = Object.values(pendingWiederherstellung.e).reduce((sum, ee) => sum + Object.keys(ee || {}).length, 0);
    $('wiederherstellung-info').textContent =
      `Datei enthält ${kursIds.length} Kurs(e) mit insgesamt ${gesamtEintraege} Eintrag/Einträgen. ` +
      `Nichts wurde gespeichert – erst ein Klick auf „Datensicherung" ersetzt die aktuellen Daten.`;
    $('wiederherstellung-liste').innerHTML = kursIds.length
      ? '<ul>' + kursIds.map(id => `<li>${escHtml(pendingWiederherstellung.m[id]?.n || '(ohne Namen)')}</li>`).join('') + '</ul>'
      : '<p class="leer">Keine Kurse in dieser Datei.</p>';
    $('wiederherstellung-vorschau').hidden = false;
    $('btn-datensicherung').textContent = 'Datensicherung (jetzt ersetzen)';
  };
  reader.readAsText(datei);
});

$('btn-wiederherstellung-abbrechen').addEventListener('click', () => {
  pendingWiederherstellung = null;
  $('wiederherstellung-vorschau').hidden = true;
  $('datei-wiederherstellung').value = '';
  $('btn-datensicherung').textContent = 'Datensicherung';
});

$('btn-kursdaten-speichern').addEventListener('click', () => {
  if(!currentKursId) return;
  pdfKurseExportieren([currentKursId], $('btn-kursdaten-speichern'));
});
